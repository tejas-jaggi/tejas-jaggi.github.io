<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a9a8f"/></marker>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a2f"/><stop offset="1" stop-color="#1f2b23"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="#12140f"/>
  <text x="30" y="38" fill="#e8e4d8" font-size="20" font-weight="700">Solstice Intelligence — Trust Pipeline</text>
  <text x="30" y="60" fill="#8a9a8f" font-size="12.5">The LLM reasons. The warehouse provides truth. Validation decides trust.</text>

  <!-- nodes -->
  <g font-size="12.5">
    <!-- Question -->
    <rect x="30" y="95" width="150" height="46" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="105" y="117" fill="#e8e4d8" text-anchor="middle" font-weight="600">Business Question</text>
    <text x="105" y="132" fill="#8a9a8f" text-anchor="middle" font-size="10.5">plain English</text>

    <!-- Grounding -->
    <rect x="30" y="170" width="150" height="46" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="105" y="192" fill="#e8e4d8" text-anchor="middle" font-weight="600">Schema Grounding</text>
    <text x="105" y="207" fill="#8a9a8f" text-anchor="middle" font-size="10.5">introspected + metadata</text>

    <!-- LLM -->
    <rect x="30" y="245" width="150" height="46" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="105" y="267" fill="#e8e4d8" text-anchor="middle" font-weight="600">LLM (tool-calling)</text>
    <text x="105" y="282" fill="#8a9a8f" text-anchor="middle" font-size="10.5">proposes candidate SQL</text>

    <!-- GATE (highlighted) -->
    <rect x="360" y="245" width="180" height="60" rx="8" fill="url(#gate)" stroke="#c9a35a" stroke-width="1.5"/>
    <text x="450" y="270" fill="#f0d9a8" text-anchor="middle" font-weight="700">VALIDATION GATE</text>
    <text x="450" y="287" fill="#c8b98f" text-anchor="middle" font-size="10">sqlglot AST · allowlist-first</text>
    <text x="450" y="299" fill="#c8b98f" text-anchor="middle" font-size="10">read-only · safe refusal</text>

    <!-- reject path -->
    <rect x="360" y="150" width="180" height="40" rx="7" fill="#241a1a" stroke="#6b3f3f"/>
    <text x="450" y="175" fill="#d8a3a3" text-anchor="middle" font-weight="600">Safe Refusal (explained)</text>

    <!-- ApprovedQuery -->
    <rect x="600" y="245" width="150" height="46" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="675" y="267" fill="#e8e4d8" text-anchor="middle" font-weight="600">ApprovedQuery</text>
    <text x="675" y="282" fill="#8a9a8f" text-anchor="middle" font-size="10.5">typed trust boundary</text>

    <!-- Executor -->
    <rect x="600" y="320" width="150" height="46" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="675" y="342" fill="#e8e4d8" text-anchor="middle" font-weight="600">Execution Engine</text>
    <text x="675" y="357" fill="#8a9a8f" text-anchor="middle" font-size="10.5">read-only DuckDB</text>

    <!-- Warehouse -->
    <rect x="600" y="95" width="150" height="46" rx="7" fill="#1a2420" stroke="#3a5044"/>
    <text x="675" y="117" fill="#bfe0cf" text-anchor="middle" font-weight="600">Certified Warehouse</text>
    <text x="675" y="132" fill="#8a9a8f" text-anchor="middle" font-size="10.5">12 tables · source of truth</text>

    <!-- Response -->
    <rect x="360" y="380" width="390" height="48" rx="7" fill="#1c1f18" stroke="#3a4034"/>
    <text x="555" y="401" fill="#e8e4d8" text-anchor="middle" font-weight="600">Structured Response</text>
    <text x="555" y="417" fill="#8a9a8f" text-anchor="middle" font-size="10.5">answer + executed SQL + plain-English explanation</text>
  </g>

  <!-- arrows -->
  <g stroke="#8a9a8f" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M105,141 L105,168"/>
    <path d="M105,216 L105,243"/>
    <path d="M180,268 L358,273"/>
    <path d="M405,245 L405,192"/>
    <path d="M540,275 L598,270"/>
    <path d="M675,291 L675,318"/>
    <path d="M600,355 L360,398"/>
    <path d="M675,320 L675,143"/>
  </g>
  <text x="415" y="222" fill="#8a6b6b" font-size="9.5">reject</text>
  <text x="690" y="235" fill="#8a9a8f" font-size="9.5" text-anchor="middle">reads</text>
</svg>
