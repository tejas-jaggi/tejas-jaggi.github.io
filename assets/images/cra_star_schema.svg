<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="900" height="480" fill="#12140f"/>
  <text x="30" y="36" fill="#e8e4d8" font-size="20" font-weight="700">Customer Revenue Analytics — Dimensional Warehouse</text>
  <text x="30" y="58" fill="#8a9a8f" font-size="12.5">Fact constellation · 12 tables · certified with 79 automated validation checks</text>

  <!-- dimensions around the facts -->
  <g font-size="11">
    <!-- top row dims -->
    <rect x="60" y="95" width="130" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="125" y="118" fill="#cfd8cf" text-anchor="middle">Dim_Customer</text>
    <rect x="230" y="95" width="130" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="295" y="118" fill="#cfd8cf" text-anchor="middle">Dim_Product</text>
    <rect x="540" y="95" width="130" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="605" y="118" fill="#cfd8cf" text-anchor="middle">Dim_Date</text>
    <rect x="710" y="95" width="150" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="785" y="118" fill="#cfd8cf" text-anchor="middle">Dim_Geography</text>

    <!-- side dims -->
    <rect x="60" y="220" width="150" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="135" y="243" fill="#cfd8cf" text-anchor="middle">Dim_Sales_Channel</text>
    <rect x="60" y="300" width="150" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="135" y="323" fill="#cfd8cf" text-anchor="middle">Dim_Campaign</text>
    <rect x="710" y="220" width="150" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="785" y="243" fill="#cfd8cf" text-anchor="middle">Dim_Mktg_Channel</text>
    <rect x="710" y="300" width="150" height="38" rx="6" fill="#1c1f18" stroke="#3a4034"/>
    <text x="785" y="323" fill="#cfd8cf" text-anchor="middle">Dim_Return_Reason</text>
  </g>

  <!-- fact tables (center, highlighted) -->
  <g font-size="11.5">
    <rect x="340" y="200" width="190" height="44" rx="7" fill="#1a2420" stroke="#5a7a64" stroke-width="1.5"/>
    <text x="435" y="220" fill="#bfe0cf" text-anchor="middle" font-weight="700">Fact_Orders</text>
    <text x="435" y="235" fill="#8a9a8f" text-anchor="middle" font-size="9.5">order-header grain</text>

    <rect x="340" y="260" width="190" height="44" rx="7" fill="#1a2420" stroke="#5a7a64" stroke-width="1.5"/>
    <text x="435" y="280" fill="#bfe0cf" text-anchor="middle" font-weight="700">Fact_Order_Lines</text>
    <text x="435" y="295" fill="#8a9a8f" text-anchor="middle" font-size="9.5">product-line grain</text>

    <rect x="340" y="320" width="190" height="40" rx="7" fill="#1a2420" stroke="#5a7a64" stroke-width="1.5"/>
    <text x="435" y="345" fill="#bfe0cf" text-anchor="middle" font-weight="700">Fact_Returns</text>

    <rect x="340" y="376" width="190" height="40" rx="7" fill="#1a2420" stroke="#5a7a64" stroke-width="1.5"/>
    <text x="435" y="401" fill="#bfe0cf" text-anchor="middle" font-weight="600" font-size="10.5">Fact_Customer_Monthly_Snapshot</text>
  </g>

  <!-- join lines from dims to fact orders -->
  <g stroke="#3a4034" stroke-width="1" fill="none" opacity="0.85">
    <path d="M125,133 L410,200"/>
    <path d="M295,133 L420,200"/>
    <path d="M605,133 L460,200"/>
    <path d="M760,133 L470,205"/>
    <path d="M210,239 L340,225"/>
    <path d="M210,319 L340,235"/>
    <path d="M710,239 L530,225"/>
    <path d="M710,319 L530,340"/>
  </g>

  <!-- validation callout -->
  <rect x="600" y="376" width="270" height="70" rx="7" fill="#181c20" stroke="#c9a35a" stroke-width="1.2"/>
  <text x="615" y="398" fill="#f0d9a8" font-size="11.5" font-weight="700">Validation Framework</text>
  <text x="615" y="416" fill="#c8b98f" font-size="10">79 reconciliation &amp; integrity checks</text>
  <text x="615" y="431" fill="#c8b98f" font-size="10">every result traceable to certified data</text>
</svg>
